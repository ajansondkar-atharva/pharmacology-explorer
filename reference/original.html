<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drug &amp; Pharmacology Explorer</title>
<meta name="description" content="A personal pharmacology reference and study system — PPIs, PCABs, NSAIDs, antibiotics, acne therapeutics, dermatology, interactions, pharmacokinetics, mechanisms, and treatment logic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DRUG & PHARMACOLOGY EXPLORER — DESIGN SYSTEM
   Signature motif: the dose–response curve. It appears in the
   mark, the hero, section dividers, and is the literal subject
   of the PK visualizer. Everything else stays quiet around it.
   ============================================================ */

:root{
  --bg:            #0A0E13;
  --bg-elevated:   #0D1218;
  --surface:       #121924;
  --surface-2:     #17202C;
  --surface-3:     #1D2735;
  --border:        rgba(232,238,243,0.08);
  --border-strong: rgba(232,238,243,0.16);
  --text:          #E9EEF3;
  --text-muted:    #91A0B2;
  --text-faint:    #5C6878;

  --accent:        #3ED9C5;   /* lab teal — primary / GI-acid family   */
  --accent-ink:    #062824;
  --sys-gi:        #3ED9C5;   /* teal    — PPI/PCAB, NSAID-GI          */
  --sys-anti:      #9B8CFB;   /* violet  — antibiotics                 */
  --sys-derm:      #F0876B;   /* coral   — dermatology / acne          */
  --sys-signal:    #E8B554;   /* amber   — PK / mechanism / data-viz   */
  --danger:        #F0876B;
  --good:          #6FD6A8;

  --font-display: 'Space Grotesk', 'IBM Plex Sans', sans-serif;
  --font-body:    'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono:    'IBM Plex Mono', ui-monospace, monospace;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --sidebar-w: 260px;
  --topbar-h: 64px;
  --shadow-lift: 0 12px 32px -12px rgba(0,0,0,0.55);
}

html[data-theme="light"]{
  --bg:            #F1F2F4;
  --bg-elevated:   #F6F7F8;
  --surface:       #FFFFFF;
  --surface-2:     #F5F6F8;
  --surface-3:     #EBEDF0;
  --border:        rgba(16,22,28,0.09);
  --border-strong: rgba(16,22,28,0.16);
  --text:          #121822;
  --text-muted:    #5B6675;
  --text-faint:    #8993A2;
  --accent-ink:    #06342E;
  --shadow-lift: 0 12px 28px -14px rgba(20,30,40,0.25);
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--text);}
p{margin:0;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent);color:var(--accent-ink);}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong);}

/* ---------- focus ---------- */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

/* ============================================================
   TYPE UTILITIES
   ============================================================ */
.eyebrow{
  font-family:var(--font-mono);
  font-size:11.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--text-faint);
  display:flex;align-items:center;gap:8px;
}
.eyebrow::before{content:"";width:14px;height:1px;background:var(--text-faint);display:inline-block;}
.h1{font-size:clamp(28px,4vw,44px);line-height:1.08;}
.h2{font-size:clamp(21px,2.6vw,28px);line-height:1.15;}
.h3{font-size:17px;line-height:1.3;}
.lede{color:var(--text-muted);font-size:15.5px;line-height:1.6;max-width:62ch;}
.mono{font-family:var(--font-mono);}
.text-muted{color:var(--text-muted);}
.text-faint{color:var(--text-faint);}

/* ============================================================
   SIGNATURE MARK — dose–response curve
   ============================================================ */
.curve-mark{display:block;overflow:visible;}
.curve-mark path{
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;
  stroke-dasharray:140;stroke-dashoffset:140;
  animation:draw 1.6s cubic-bezier(.4,.1,.2,1) forwards;
}
@keyframes draw{to{stroke-dashoffset:0;}}
.curve-divider{width:100%;height:34px;color:var(--border-strong);margin:0 auto;display:block;opacity:.9;}
.curve-divider path{stroke-width:1.5;}

/* ============================================================
   APP SHELL
   ============================================================ */
.app-shell{display:flex;min-height:100vh;}

/* ---------- sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);flex:none;
  background:var(--bg-elevated);
  border-right:1px solid var(--border);
  height:100vh;position:sticky;top:0;
  display:flex;flex-direction:column;
  padding:20px 14px;
  overflow-y:auto;
  z-index:40;
  transition:transform .25s ease;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;color:var(--accent);}
.brand-word{font-family:var(--font-display);font-weight:700;font-size:15.5px;color:var(--text);letter-spacing:-.01em;}
.brand-word span{color:var(--accent);}
.nav-group{margin-bottom:4px;}
.nav-group-label{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-faint);padding:16px 10px 6px;
}
.nav-link{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:10px;
  color:var(--text-muted);font-size:13.6px;font-weight:500;
  text-decoration:none;cursor:pointer;
  border:1px solid transparent;
  transition:background .15s ease,color .15s ease;
  white-space:nowrap;
}
.nav-link:hover{background:var(--surface);color:var(--text);}
.nav-link.active{background:var(--surface-2);color:var(--text);border-color:var(--border);}
.nav-link.active .nav-dot{background:var(--accent);}
.nav-link[data-sys="anti"].active .nav-dot{background:var(--sys-anti);}
.nav-link[data-sys="derm"].active .nav-dot{background:var(--sys-derm);}
.nav-link[data-sys="signal"].active .nav-dot{background:var(--sys-signal);}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex:none;}
.sidebar-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--border);}
.basket-pill{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--border);
  font-size:12.5px;color:var(--text-muted);cursor:pointer;
}
.basket-pill b{color:var(--text);font-family:var(--font-mono);}

.sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;}

/* ---------- topbar ---------- */
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:var(--topbar-h);flex:none;
  display:flex;align-items:center;gap:14px;
  padding:0 24px;
  border-bottom:1px solid var(--border);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:30;
}
.hamburger{display:none;background:none;border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:9px;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.crumb{font-size:13px;color:var(--text-faint);white-space:nowrap;}
.crumb b{color:var(--text-muted);font-weight:500;}
.search-wrap{flex:1;max-width:420px;margin-left:auto;position:relative;}
.search-input{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:9px 13px 9px 34px;border-radius:10px;font-size:13.5px;font-family:var(--font-body);
}
.search-input::placeholder{color:var(--text-faint);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none;}
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;
  box-shadow:var(--shadow-lift);max-height:60vh;overflow-y:auto;display:none;z-index:50;
}
.search-results.open{display:block;}
.search-row{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;border-bottom:1px solid var(--border);}
.search-row:last-child{border-bottom:none;}
.search-row:hover{background:var(--surface-3);}
.search-row .sw-name{font-size:13.5px;font-weight:500;}
.search-row .sw-meta{font-size:11.5px;color:var(--text-faint);margin-left:auto;font-family:var(--font-mono);}
.theme-btn{
  background:var(--surface);border:1px solid var(--border);color:var(--text-muted);
  width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
}
.theme-btn:hover{color:var(--text);border-color:var(--border-strong);}

main#app{padding:32px 36px 80px;max-width:1280px;width:100%;margin:0 auto;}
.view{display:none;}
.view.active{display:block;animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ============================================================
   REUSABLE COMPONENTS
   ============================================================ */

/* chip / filter */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
  cursor:pointer;user-select:none;transition:all .15s ease;white-space:nowrap;
}
.chip:hover{border-color:var(--border-strong);color:var(--text);}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.chip[data-sys="anti"].active{background:var(--sys-anti);border-color:var(--sys-anti);color:#100B2E;}
.chip[data-sys="derm"].active{background:var(--sys-derm);border-color:var(--sys-derm);color:#2E0F06;}
.chip[data-sys="signal"].active{background:var(--sys-signal);border-color:var(--sys-signal);color:#2E2003;}

/* badges (color-coded taxonomy, functional not decorative) */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:6px;font-family:var(--font-mono);text-transform:uppercase;}
.badge-gi{background:rgba(62,217,197,.13);color:var(--sys-gi);}
.badge-anti{background:rgba(155,140,251,.15);color:var(--sys-anti);}
.badge-derm{background:rgba(240,135,107,.15);color:var(--sys-derm);}
.badge-signal{background:rgba(232,181,84,.15);color:var(--sys-signal);}
.badge-flagship{background:linear-gradient(90deg,rgba(240,135,107,.2),rgba(232,181,84,.2));color:var(--text);}

/* card */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:20px;position:relative;
}
.card-interactive{cursor:pointer;transition:border-color .18s ease,transform .18s ease,background .18s ease;}
.card-interactive:hover{border-color:var(--border-strong);transform:translateY(-2px);background:var(--surface-2);}

/* dashboard bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
.tile{
  grid-column:span 3;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:22px;cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .2s ease,transform .2s ease,background .2s ease;
  display:flex;flex-direction:column;gap:10px;min-height:150px;
}
.tile:hover{border-color:var(--border-strong);transform:translateY(-3px);background:var(--surface-2);}
.tile:hover .tile-curve{opacity:1;stroke-dashoffset:0;}
.tile-lg{grid-column:span 4;min-height:190px;}
.tile-md{grid-column:span 2;min-height:150px;}
.tile-sm{grid-column:span 2;min-height:118px;}
.tile-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;}
.tile-title{font-family:var(--font-display);font-weight:600;font-size:17px;}
.tile-desc{font-size:12.8px;color:var(--text-muted);line-height:1.5;}
.tile-curve{position:absolute;right:14px;bottom:10px;width:88px;height:34px;opacity:.35;stroke-dashoffset:140;transition:opacity .3s ease,stroke-dashoffset .6s ease;pointer-events:none;}
.quick-row{display:flex;flex-wrap:wrap;gap:10px;}
.quick-btn{
  display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .15s ease;
}
.quick-btn:hover{border-color:var(--accent);color:var(--accent);}

/* accordion */
.accordion-item{border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;overflow:hidden;background:var(--surface);scroll-margin-top:84px;}
.accordion-header{
  display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;user-select:none;
}
.accordion-header:hover{background:var(--surface-2);}
.accordion-chevron{margin-left:auto;transition:transform .2s ease;color:var(--text-faint);flex:none;}
.accordion-item.open .accordion-chevron{transform:rotate(180deg);}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.accordion-item.open .accordion-body{max-height:2400px;}
.accordion-body-inner{padding:0 18px 20px;}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tab-btn{
  padding:10px 16px;font-size:13.5px;font-weight:500;color:var(--text-muted);background:none;border:none;
  border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;margin-bottom:-1px;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-panel{display:none;}
.tab-panel.active{display:block;animation:fadein .25s ease;}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);}
table.compare{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
table.compare th,table.compare td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top;}
table.compare thead th{
  background:var(--surface-2);color:var(--text-faint);font-family:var(--font-mono);font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;font-weight:600;position:sticky;top:0;
}
table.compare tbody tr:hover{background:var(--surface-2);}
table.compare th:first-child,table.compare td:first-child{position:sticky;left:0;background:var(--surface);font-weight:600;z-index:1;}
table.compare thead th:first-child{background:var(--surface-2);z-index:2;}

/* drug detail card */
.drug-card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);margin-bottom:16px;overflow:hidden;scroll-margin-top:84px;position:relative;}
.drug-card-head{padding:20px 22px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;}
.drug-card-head:hover{background:var(--surface-2);}
.drug-name{font-family:var(--font-display);font-size:18px;font-weight:600;}
.drug-sub{font-size:12.5px;color:var(--text-faint);font-family:var(--font-mono);margin-top:2px;}
.drug-summary{font-size:13px;color:var(--text-muted);margin-top:6px;max-width:70ch;}
.drug-card-body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.drug-card.open .drug-card-body{max-height:4000px;}
.drug-card.open .accordion-chevron{transform:rotate(180deg);}
.drug-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--border);}
.drug-field{padding:16px 22px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);}
.drug-field:nth-child(2n){border-right:none;}
.field-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;display:block;}
.field-value{font-size:13.3px;color:var(--text);line-height:1.55;}
.pearl-box{margin:16px 22px 20px;padding:13px 16px;border-radius:10px;background:linear-gradient(135deg,rgba(232,181,84,.08),rgba(240,135,107,.06));border:1px solid rgba(232,181,84,.22);font-size:13px;}
.pearl-label{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--sys-signal);margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.compare-check{position:absolute;top:18px;right:20px;}

/* pros/cons/best/avoid blocks */
.pcba-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 22px 20px;}
.pcba-box{border-radius:10px;padding:12px 14px;font-size:12.8px;line-height:1.5;}
.pcba-good{background:rgba(111,214,168,.08);border:1px solid rgba(111,214,168,.22);}
.pcba-bad{background:rgba(240,135,107,.08);border:1px solid rgba(240,135,107,.22);}
.pcba-label{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:600;}
.pcba-good .pcba-label{color:var(--good);}
.pcba-bad .pcba-label{color:var(--sys-derm);}

/* timeline */
.timeline{position:relative;padding-left:26px;margin:26px 0;}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1.5px;background:var(--border-strong);}
.timeline-item{position:relative;padding-bottom:26px;}
.timeline-item::before{content:"";position:absolute;left:-26px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);}
.timeline-era{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
.timeline-title{font-family:var(--font-display);font-weight:600;font-size:15px;margin:3px 0 5px;}
.timeline-desc{font-size:13px;color:var(--text-muted);max-width:68ch;}

/* pill list */
.pill-list{display:flex;flex-wrap:wrap;gap:6px;}
.pill{font-size:11.5px;padding:4px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-family:var(--font-mono);}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;
  cursor:pointer;border:1px solid transparent;transition:all .15s ease;
}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--border-strong);}
.btn-sm{padding:6px 12px;font-size:12px;}

/* disclaimer */
.disclaimer{
  display:flex;gap:11px;padding:14px 16px;border-radius:12px;
  background:rgba(232,181,84,.07);border:1px solid rgba(232,181,84,.25);font-size:12.6px;color:var(--text-muted);line-height:1.55;margin:18px 0;
}
.disclaimer svg{flex:none;color:var(--sys-signal);margin-top:1px;}
.disclaimer b{color:var(--text);}

/* section header */
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
.section-head .h1{margin-top:6px;}

/* checkbox custom */
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.cb.checked{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

/* empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
.empty-state svg{margin-bottom:14px;opacity:.5;}

/* responsive */
@media (max-width:1024px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow-lift);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-scrim.open{display:block;}
  .hamburger{display:flex;}
  main#app{padding:24px 18px 70px;}
  .bento{grid-template-columns:repeat(2,1fr);}
  .tile,.tile-lg,.tile-md,.tile-sm{grid-column:span 2;}
  .drug-grid{grid-template-columns:1fr;}
  .drug-field:nth-child(2n){border-right:1px solid var(--border);}
  .pcba-grid{grid-template-columns:1fr;}
  .search-wrap{max-width:none;}
}
@media (max-width:640px){
  .topbar{padding:0 14px;gap:10px;}
  .crumb{display:none;}
}
</style>
</head>
<body>

<div class="app-shell">
  <div class="sidebar-scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">

<script>
/* ============================================================
   CORE APP — data namespace, helpers, router, nav, search, theme
   ============================================================ */
const DATA = {}; // populated by each module below

const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));

function el(tag, attrs={}, ...children){
  const node = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='html'){ node.innerHTML = v; }
    else if(k.startsWith('on') && typeof v==='function'){ node.addEventListener(k.slice(2), v); }
    else if(v!==false && v!==null && v!==undefined){ node.setAttribute(k, v===true?'':v); }
  }
  children.flat().forEach(c=>{
    if(c===null||c===undefined||c===false) return;
    node.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
  });
  return node;
}

function curveSVG(cls='curve-mark', w=90, h=34, color=null){
  const s = `<svg class="${cls}" width="${w}" height="${h}" viewBox="0 0 90 34" ${color?`style="color:${color}"`:''}><path d="M2 28 C 18 28, 24 6, 42 6 S 70 28, 88 28" /></svg>`;
  const wrap = document.createElement('div');
  wrap.innerHTML = s;
  return wrap.firstChild;
}

/* ---------- system taxonomy ---------- */
const SYS = {
  gi:     {label:'Acid / GI',      badge:'badge-gi',     var:'--sys-gi'},
  anti:   {label:'Antimicrobial',  badge:'badge-anti',   var:'--sys-anti'},
  derm:   {label:'Dermatology',    badge:'badge-derm',   var:'--sys-derm'},
  signal: {label:'PK / Mechanism', badge:'badge-signal', var:'--sys-signal'}
};
function badgeFor(sys, textOverride){
  const s = SYS[sys] || SYS.gi;
  return el('span',{class:`badge ${s.badge}`}, textOverride||s.label);
}

/* ---------- comparison basket (in-memory; resets on reload — this is a
   local browser session tool, not an account, so nothing is sent anywhere) ---------- */
const basket = new Set();
function toggleBasket(id){
  if(basket.has(id)) basket.delete(id); else {
    if(basket.size>=4){ alert('Compare up to 4 items at a time — remove one first.'); return; }
    basket.add(id);
  }
  $('#basketCount').textContent = basket.size;
  $$(`[data-compare-id]`).forEach(elx=>{
    elx.classList.toggle('checked', basket.has(elx.dataset.compareId));
  });
  if(currentView==='notes') renderNotes();
}

/* ---------- saved/pinned notes (in-memory) ---------- */
const pinned = new Set();
function togglePin(id){
  if(pinned.has(id)) pinned.delete(id); else pinned.add(id);
  if(currentView==='notes') renderNotes();
}

/* ============================================================
   ROUTER
   ============================================================ */
const VIEW_LABEL = {
  home:'Dashboard', classes:'Drug Directory', ppi:'PPIs & PCABs', nsaid:'NSAID Evolution',
  antibiotics:'Antibiotics', acne:'Acne Therapeutics', derm:'Dermatology Handbook',
  interactions:'Interaction Checker', pk:'PK Visualizer', mechanisms:'Mechanism Explorer',
  algorithms:'Treatment Algorithms', wiki:'Drug Atlas', notes:'Saved & Compare'
};
let currentView = 'home';
const renderers = {}; // view -> function

function navigate(view, param){
  if(!renderers[view]) return;
  currentView = view;
  location.hash = param ? `${view}/${param}` : view;
  $$('.nav-link').forEach(n=>n.classList.toggle('active', n.dataset.view===view));
  $('#crumb').innerHTML = `Pharm.Explorer <span style="color:var(--text-faint)">/</span> <b>${VIEW_LABEL[view]||view}</b>`;
  const app = $('#app');
  app.innerHTML = '';
  const viewEl = el('div',{class:'view active'});
  app.appendChild(viewEl);
  renderers[view](viewEl, param);
  window.scrollTo({top:0,behavior:'instant'});
  closeSidebar();
}

function router(){
  const hash = location.hash.replace('#','');
  const [view, param] = hash.split('/');
  navigate(view && renderers[view] ? view : 'home', param);
}
window.addEventListener('hashchange', router);

$$('.nav-link').forEach(n=>n.addEventListener('click', ()=>navigate(n.dataset.view)));

/* ---------- sidebar mobile ---------- */
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#hamburger').addEventListener('click', ()=>{ $('#sidebar').classList.add('open'); $('#scrim').classList.add('open'); });
$('#scrim').addEventListener('click', closeSidebar);

/* ---------- theme ---------- */
let theme = 'dark';
function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
  $('#themeIcon').innerHTML = theme==='dark'
    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    : '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>';
}
$('#themeBtn').addEventListener('click', ()=>{ theme = theme==='dark'?'light':'dark'; applyTheme(); });
applyTheme();

/* ---------- global search (built once all module DATA is loaded) ---------- */
let SEARCH_INDEX = [];
function buildSearchIndex(){
  SEARCH_INDEX = [];
  (DATA.ppi||[]).forEach(d=>SEARCH_INDEX.push({id:d.id,name:d.name,meta:'PPI/PCAB',sys:'gi',view:'ppi',blob:[d.name,d.cls,d.summary,(d.fields||[]).map(f=>f.join(' ')).join(' '),d.good,d.bad,d.pearl].filter(Boolean).join(' ').toLowerCase()}));
  (DATA.nsaid||[]).forEach(d=>SEARCH_INDEX.push({id:d.id,name:d.name,meta:'NSAID',sys:'gi',view:'nsaid',blob:[d.name,d.cls,d.summary,(d.fields||[]).map(f=>f.join(' ')).join(' '),d.good,d.bad,d.pearl].filter(Boolean).join(' ').toLowerCase()}));
  (DATA.antibiotics||[]).forEach(cls=> (cls.drugs||[]).forEach(d=>SEARCH_INDEX.push({id:d.id,name:d.name,meta:cls.name,sys:'anti',view:'antibiotics',blob:[d.name,cls.name,d.summary,(d.fields||[]).map(f=>f.join(' ')).join(' '),d.good,d.bad,d.pearl].filter(Boolean).join(' ').toLowerCase()})));
  (DATA.acne||[]).forEach(d=>SEARCH_INDEX.push({id:d.id,name:d.name,meta:'Acne agent',sys:'derm',view:'acne',blob:[d.name,d.cls,d.summary,d.pearl].filter(Boolean).join(' ').toLowerCase()}));
  (DATA.mechanisms||[]).forEach(m=>SEARCH_INDEX.push({id:m.id,name:m.name,meta:'Mechanism',sys:'signal',view:'mechanisms',blob:[m.name,m.summary,m.subtitle,m.use].filter(Boolean).join(' ').toLowerCase()}));
  (DATA.derm||[]).forEach(t=>SEARCH_INDEX.push({id:t.id,name:t.name,meta:'Dermatology topic',sys:'derm',view:'derm',blob:[t.name,t.summary,t.subtitle,t.desc].filter(Boolean).join(' ').toLowerCase()}));
  (DATA.wiki||[]).forEach(d=>SEARCH_INDEX.push({id:d.id,name:d.name,meta:d.cls||'Drug atlas',sys:'signal',view:'wiki',blob:[d.name,d.cls,d.summary,(d.fields||[]).map(f=>f.join(' ')).join(' '),d.good,d.bad,d.pearl].filter(Boolean).join(' ').toLowerCase()}));
}
const searchInput = $('#searchInput');
const searchResults = $('#searchResults');
searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  if(!q){ searchResults.classList.remove('open'); return; }
  const matches = SEARCH_INDEX.filter(x=>x.blob?.includes(q) || x.name.toLowerCase().includes(q) || (x.meta||'').toLowerCase().includes(q)).slice(0,8);
  searchResults.innerHTML = '';
  if(!matches.length){
    searchResults.appendChild(el('div',{class:'search-row',style:'color:var(--text-faint)'},'No matches'));
  } else {
    matches.forEach(m=>{
      const row = el('div',{class:'search-row'},
        el('span',{class:'sw-name'}, m.name),
        el('span',{class:'sw-meta'}, m.meta)
      );
      row.addEventListener('click', ()=>{ searchResults.classList.remove('open'); searchInput.value=''; navigate(m.view, m.id); });
      searchResults.appendChild(row);
    });
  }
  searchResults.classList.add('open');
});
document.addEventListener('click', (e)=>{ if(!e.target.closest('.search-wrap')) searchResults.classList.remove('open'); });

/* ---------- shared UI builders ---------- */
function pcbaBlock(good, bad){
  return el('div',{class:'pcba-grid'},
    el('div',{class:'pcba-box pcba-good'}, el('div',{class:'pcba-label'},'Best for'), el('div',{},good)),
    el('div',{class:'pcba-box pcba-bad'}, el('div',{class:'pcba-label'},'Avoid / caution when'), el('div',{},bad))
  );
}
function pearlBox(text){
  return el('div',{class:'pearl-box'},
    el('div',{class:'pearl-label'},'💡 Clinical pearl'),
    el('div',{}, text)
  );
}
function fieldGrid(fields){
  const grid = el('div',{class:'drug-grid'});
  fields.forEach(([label,value])=>{
    grid.appendChild(el('div',{class:'drug-field'},
      el('span',{class:'field-label'}, label),
      el('div',{class:'field-value',html:value})
    ));
  });
  return grid;
}
function disclaimerBox(text){
  return el('div',{class:'disclaimer'},
    el('div',{html:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 2.5 17.5A1.8 1.8 0 0 0 4 20h16a1.8 1.8 0 0 0 1.5-2.5L13.7 3.9a1.8 1.8 0 0 0-3.4 0Z"/></svg>'}),
    el('div',{html:text})
  );
}
function pill(text){ return `<span class="pill">${text}</span>`; }
function pillList(arr){ return `<div class="pill-list">${arr.map(pill).join('')}</div>`; }

/* ============================================================
   MODULE: HOME DASHBOARD
   ============================================================ */
const QUICK_ACTIONS = [
  {label:'Compare two drugs', view:'notes',        icon:'<path d="M8 6v12M16 6v12M4 9h4M4 15h4M16 9h4M16 15h4"/>'},
  {label:'Explore a class',   view:'classes',       icon:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'},
  {label:'Open Drug Atlas',    view:'wiki',          icon:'<path d="M4 6h16M4 12h16M4 18h10"/>'},
  {label:'Study by mechanism',view:'mechanisms',    icon:'<circle cx="12" cy="12" r="2.5"/><circle cx="5" cy="5" r="1.6"/><circle cx="19" cy="19" r="1.6"/>'},
  {label:'See treatment pathways', view:'algorithms', icon:'<circle cx="12" cy="4" r="2"/><path d="M12 6v4M12 10 6 15M12 10l6 5"/>'},
  {label:'Check interactions',view:'interactions',  icon:'<circle cx="7" cy="12" r="4"/><circle cx="17" cy="12" r="4"/>'},
  {label:'Open timeline',     view:'nsaid',          icon:'<path d="M3 19 C7 19 9 5 13 5 S19 12 21 12"/>'}
];

const MODULE_TILES = [
  {view:'ppi', size:'lg', sys:'gi', title:'PPIs & PCABs', desc:'Seven acid-suppressing agents — potency, onset, pH control, and when one beats another.', icon:'<path d="M12 2v6M8 8h8l2 12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L8 8z"/>'},
  {view:'nsaid', size:'md', sys:'gi', title:'NSAID Evolution', desc:'COX-1 vs COX-2, and the 40-year argument over GI, renal, and CV tradeoffs.', icon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>'},
  {view:'acne', size:'lg', sys:'derm', title:'Acne Therapeutics', desc:'Retinoids through isotretinoin — mechanism, irritation risk, and what not to combine.', icon:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>', flagship:true},
  {view:'derm', size:'md', sys:'derm', title:'Dermatology Handbook', desc:'PIH, barrier repair, and the logic of layering vs. simplifying a regimen.', icon:'<path d="M12 3c4 3 7 6.5 7 10.5a7 7 0 1 1-14 0C5 9.5 8 6 12 3Z"/>'},
  {view:'wiki', size:'lg', sys:'signal', title:'Drug Atlas', desc:'Wikipedia-style monographs for high-yield drugs across cardiology, endocrinology, psychiatry, respiratory, and more.', icon:'<path d="M4 6h16M4 12h16M4 18h10"/>' , flagship:true},
  {view:'antibiotics', size:'md', sys:'anti', title:'Antibiotic Comparison', desc:'Nine classes by spectrum, resistance pattern, and clinical use case.', icon:'<path d="M8.5 15.5 15.5 8.5M6 18a3 3 0 0 1 0-4.2l7.8-7.8a3 3 0 1 1 4.2 4.2L10.2 18A3 3 0 0 1 6 18Z"/>'},
  {view:'interactions', size:'md', sys:'signal', title:'Interaction Checker', desc:'Pick two agents — see the mechanism behind the warning, not just a red flag.', icon:'<circle cx="7" cy="12" r="4"/><circle cx="17" cy="12" r="4"/>'},
  {view:'pk', size:'md', sys:'signal', title:'Pharmacokinetics Visualizer', desc:'Absorption, half-life, and steady state — drawn as curves, not just numbers.', icon:'<path d="M3 19 C7 19 9 5 13 5 S19 12 21 12"/>'},
  {view:'mechanisms', size:'md', sys:'signal', title:'Mechanism Explorer', desc:'Nine core mechanisms of action, from target to clinical consequence.', icon:'<circle cx="12" cy="12" r="2.5"/><circle cx="5" cy="5" r="1.6"/><circle cx="19" cy="5" r="1.6"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/>'},
  {view:'algorithms', size:'md', sys:'signal', title:'Treatment Algorithms', desc:'Guided decision logic for acid disorders and acne severity — for study, not diagnosis.', icon:'<circle cx="12" cy="4" r="2"/><path d="M12 6v4M12 10 6 15M12 10l6 5"/>'},
  {view:'classes', size:'md', sys:null, title:'Drug Directory', desc:'Every drug in this reference, searchable and filterable by class.', icon:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'}
];

renderers.home = function(root){
  const totalDrugs = (DATA.ppi?.length||0) + (DATA.nsaid?.length||0) + (DATA.acne?.length||0) +
    (DATA.wiki?.length||0) + (DATA.antibiotics||[]).reduce((n,c)=>n+(c.drugs?.length||0),0);
  const totalClasses = new Set([
    ...(DATA.ppi||[]).map(d=>d.cls),
    ...(DATA.nsaid||[]).map(d=>d.cls),
    ...(DATA.acne||[]).map(d=>d.cls),
    ...(DATA.wiki||[]).map(d=>d.cls),
    ...(DATA.antibiotics||[]).map(c=>c.name)
  ].filter(Boolean)).size;
  const totalInteractions = (DATA.interactions||[]).length;
  const totalMechanisms = (DATA.mechanisms||[]).length;

  const hero = el('section',{style:'position:relative;padding:44px 0 38px;border-bottom:1px solid var(--border);margin-bottom:34px;overflow:hidden;'},
    el('div',{style:'position:absolute;right:-20px;top:10px;width:min(560px,70%);opacity:.55;pointer-events:none;',html:
      `<svg viewBox="0 0 400 160" width="100%" style="color:var(--accent)"><path d="M10 140 C 90 140, 130 20, 210 20 S 330 140, 390 140" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="640" stroke-dashoffset="640" style="animation:draw 2.2s cubic-bezier(.4,.1,.2,1) forwards"/><path d="M10 140 C 90 140, 130 20, 210 20 S 330 140, 390 140" fill="none" stroke="currentColor" stroke-width="2" opacity=".12"/></svg>`
    }),
    el('div',{class:'eyebrow'},'Personal pharmacology reference'),
    el('h1',{class:'h1',style:'margin-top:10px;max-width:14ch;'},'From mechanism to milligram.'),
    el('p',{class:'lede',style:'margin-top:12px;'},'A working reference for acid suppression, antimicrobials, NSAIDs, and dermatologic therapy — organized around comparison and mechanism instead of loose facts. Built for revision, not browsing.'),
    el('div',{class:'quick-row',style:'margin-top:24px;'},
      ...QUICK_ACTIONS.map(a=>{
        const b = el('button',{class:'quick-btn',html:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${a.icon}</svg><span>${a.label}</span>`});
        b.addEventListener('click', ()=>navigate(a.view));
        return b;
      })
    ),
    el('div',{style:'display:flex;gap:28px;margin-top:32px;flex-wrap:wrap;'},

   (used by PPI, NSAID, Antibiotic, and Acne modules)

function drugCard(d, sysKey){
  const card = el('div',{class:'drug-card', id:'card-'+d.id});
  const cb = el('div',{class:'cb compare-check', 'data-compare-id':d.id, title:'Add to compare basket'},
    '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>'
  );
  cb.innerHTML = basket.has(d.id) ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>' : '';
  cb.classList.toggle('checked', basket.has(d.id));
  cb.addEventListener('click', (e)=>{
    e.stopPropagation();
    toggleBasket(d.id);
    cb.classList.toggle('checked', basket.has(d.id));
    cb.innerHTML = basket.has(d.id) ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>' : '';
  });
  const head = el('div',{class:'drug-card-head'},
    el('div',{style:'flex:1;min-width:0;'},
      el('div',{style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap;'},
        el('div',{class:'drug-name'}, d.name),
        badgeFor(sysKey, d.cls)
      ),
      d.sub ? el('div',{class:'drug-sub'}, d.sub) : null,
      el('div',{class:'drug-summary'}, d.summary)
    ),
    cb,
    el('svg',{class:'accordion-chevron',width:'16',height:'16',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':'2',style:'margin-top:6px',html:'<path d="m6 9 6 6 6-6"/>'})
  );
  head.addEventListener('click', (e)=>{ if(e.target.closest('.compare-check')) return; card.classList.toggle('open'); });
  const body = el('div',{class:'drug-card-body'},
    fieldGrid(d.fields),
    (d.good||d.bad) ? pcbaBlock(d.good||'—', d.bad||'—') : null,
    d.pearl ? pearlBox(d.pearl) : null
  );
  card.appendChild(head);
  card.appendChild(body);
  return card;
}
function compareTable(headers, rows){
  const wrap = el('div',{class:'table-wrap'});
  const t = el('table',{class:'compare'});
  const thead = el('thead',{}, el('tr',{}, ...headers.map(h=>el('th',{},h))));
  const tbody = el('tbody',{}, ...rows.map(r=>el('tr',{}, ...r.map(c=>el('td',{html:c})))));
  t.appendChild(thead); t.appendChild(tbody);
  wrap.appendChild(t);
  return wrap;
}
function buildTabs(tabDefs, container){
  const tabRow = el('div',{class:'tabs'});
  const panelWrap = el('div',{});
  tabDefs.forEach((t,i)=>{
    const btn = el('button',{class:'tab-btn'+(i===0?' active':'')}, t.label);
    const panel = el('div',{class:'tab-panel'+(i===0?' active':'')});
    panel.appendChild(t.render());
    btn.addEventListener('click', ()=>{
      $$('.tab-btn',tabRow).forEach(b=>b.classList.remove('active'));
      $$('.tab-panel',panelWrap).forEach(p=>p.classList.remove('active'));
      btn.classList.add('active'); panel.classList.add('active');
    });
    tabRow.appendChild(btn);
    panelWrap.appendChild(panel);
  });
  container.appendChild(tabRow);
  container.appendChild(panelWrap);
}
function timelineBlock(items){
  const tl = el('div',{class:'timeline'});
  items.forEach(it=>{
    tl.appendChild(el('div',{class:'timeline-item'},
      el('div',{class:'timeline-era'}, it.era),
      el('div',{class:'timeline-title'}, it.title),
      el('div',{class:'timeline-desc'}, it.desc)
    ));
  });
  return tl;
}

              badgeFor('anti','Class')
            ),
            el('div',{class:'text-muted',style:'font-size:13px;'}, d.useCases[key])
          ));
        });
      }
      Object.keys(USE_CASE_LABELS).forEach((key,i)=>{
        const chip = el('div',{class:'chip'+(i===0?' active':''),'data-key':key,'data-sys':'anti'}, USE_CASE_LABELS[key]);
        chip.addEventListener('click', ()=>showUseCase(key));
        chipRow.appendChild(chip);
      });
      wrap.appendChild(chipRow);
      wrap.appendChild(results);
      showUseCase(Object.keys(USE_CASE_LABELS)[0]);
      return wrap;
    }}
  ], root);
};

const PK_CONCEPTS = [
  {t:'Absorption', d:'The movement of drug from the site of administration into the bloodstream. Oral absorption depends on formulation, gut pH, and whether food or chelating cations are present — see the meal-timing notes throughout the PPI and tetracycline entries.'},
  {t:'Bioavailability (F)', d:'The fraction of an administered dose that reaches systemic circulation intact. IV drugs are 100% bioavailable by definition; oral drugs lose some fraction to incomplete absorption and first-pass metabolism.'},
  {t:'First-pass metabolism', d:'Oral drugs are absorbed into the portal circulation and pass through the liver before reaching the rest of the body — the liver can metabolize a significant fraction before it ever acts. Esomeprazole\u2019s entire rationale is reducing how much of the dose is lost this way.'},
  {t:'Distribution (Vd)', d:'How a drug partitions between blood and tissues, expressed as a volume of distribution — a conceptual, not literal, volume. A high Vd means a drug is extensively tissue-bound rather than staying in the bloodstream.'},
  {t:'Metabolism', d:'Enzymatic transformation of a drug, usually hepatic (CYP enzymes are the dominant system) — can activate a prodrug, inactivate an active drug, or both in different pathways at once, as with omeprazole\u2019s CYP2C19 route.'},
  {t:'Elimination & half-life', d:'The time for plasma concentration to fall by half. For irreversible-mechanism drugs like PPIs, clinical effect duration can far outlast plasma half-life — the pump, not the drug, sets the clock.'},
  {t:'Peak time (Tmax) & Cmax', d:'The time to reach, and the value of, the highest plasma concentration after a dose — set by the balance between absorption rate and elimination rate, not by either alone.'},
  {t:'Steady state', d:'With repeated dosing, concentration rises until the amount eliminated between doses equals the amount absorbed — reached after roughly 4–5 half-lives, regardless of dose size.'},
  {t:'Delayed vs. immediate release', d:'Enteric coatings delay drug release until reaching a less acidic environment (protecting acid-labile drugs like PPIs from stomach acid); dual delayed-release formulations like dexlansoprazole deliberately create two absorption pulses to extend the effective duration.'}
];

function pkConc(t, ka, ke, dose, F, Vd, tLag){
  const tt = t - (tLag||0);
  if(tt < 0) return 0;
  if(Math.abs(ka-ke) < 1e-6) ka = ke*1.001;
  const val = (dose*F*ka)/(Vd*(ka-ke)) * (Math.exp(-ke*tt) - Math.exp(-ka*tt));
  return Math.max(0,val);
}
function pkSeries(ka, ke, dose, F, Vd, tLag, tMax, step){
  const pts = [];
  for(let t=0; t<=tMax; t+=step){ pts.push({t, c: pkConc(t,ka,ke,dose,F,Vd,tLag)}); }
  return pts;
}
function pkMultiDose(ka, ke, dose, F, Vd, interval, numDoses, tMax, step){
  const pts = [];
  for(let t=0; t<=tMax; t+=step){
    let c = 0;
    for(let n=0;n<numDoses;n++){
      const doseTime = n*interval;
      if(t>=doseTime) c += pkConc(t-doseTime, ka, ke, dose, F, Vd, 0);
    }
    pts.push({t,c});
  }
  return pts;
}

function drawPKChart(canvas, seriesList, opts={}){
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(280, rect.width), h = opts.height||260;
  canvas.width = w*dpr; canvas.height = h*dpr;
  canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const pad = {l:44,r:14,t:16,b:30};
  const plotW = w-pad.l-pad.r, plotH = h-pad.t-pad.b;
  let maxT=0, maxC=0;
  seriesList.forEach(s=>s.points.forEach(p=>{ if(p.t>maxT) maxT=p.t; if(p.c>maxC) maxC=p.c; }));
  maxC = maxC*1.15 || 1;
  const X = t => pad.l + (t/maxT)*plotW;
  const Y = c => pad.t + plotH - (c/maxC)*plotH;
  const styles = getComputedStyle(document.documentElement);
  const border = styles.getPropertyValue('--border-strong').trim();
  const faint = styles.getPropertyValue('--text-faint').trim();
  const textCol = styles.getPropertyValue('--text-muted').trim();
  // axes
  ctx.strokeStyle = border; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,pad.t+plotH); ctx.lineTo(pad.l+plotW,pad.t+plotH); ctx.stroke();
  ctx.fillStyle = faint; ctx.font='10.5px "IBM Plex Mono",monospace';
  for(let i=0;i<=4;i++){
    const tt = maxT*i/4;
    ctx.fillText(Math.round(tt)+'h', X(tt)-8, pad.t+plotH+18);
  }
  ctx.textAlign='right';
  for(let i=0;i<=3;i++){
    const cc = maxC*i/3;
    ctx.fillText(cc.toFixed(0), pad.l-8, Y(cc)+3);
  }
  ctx.textAlign='left';
  // series
  seriesList.forEach(s=>{
    ctx.strokeStyle = s.color; ctx.lineWidth=2.2; ctx.beginPath();
    s.points.forEach((p,i)=>{ const x=X(p.t), y=Y(p.c); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();
    if(s.fill){
      ctx.lineTo(X(s.points[s.points.length-1].t), pad.t+plotH);
      ctx.lineTo(X(s.points[0].t), pad.t+plotH);
      ctx.closePath();
      ctx.fillStyle = s.color+'18'; ctx.fill();
    }
  });
  // annotations
  (opts.annotations||[]).forEach(a=>{
    ctx.strokeStyle = faint; ctx.setLineDash([3,3]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(a.t), Y(a.c)); ctx.lineTo(X(a.t), pad.t+plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.l, Y(a.c)); ctx.lineTo(X(a.t), Y(a.c)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = textCol; ctx.font='10.5px "IBM Plex Mono",monospace';
    ctx.fillText(a.label, X(a.t)+5, Y(a.c)-6);
  });
  if(opts.hLine!==undefined){
    ctx.strokeStyle = faint; ctx.setLineDash([2,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pad.l, Y(opts.hLine)); ctx.lineTo(pad.l+plotW, Y(opts.hLine)); ctx.stroke();
    ctx.setLineDash([]);
  }
}

      el('h1',{class:'h1'},'Pharmacokinetics Visualizer'),
      el('p',{class:'lede',style:'margin-top:8px;'},'Absorption rate and elimination rate together determine everything downstream — Tmax, Cmax, and how long it takes to reach steady state. Adjust them below and watch the curve respond.')
    )
  ));

  const grid = el('div',{style:'display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px;'});
  PK_CONCEPTS.forEach(c=>{
    grid.appendChild(el('div',{class:'card'},
      el('div',{class:'h3',style:'font-size:14px;margin-bottom:6px;color:var(--sys-signal);'}, c.t),
      el('div',{class:'text-muted',style:'font-size:12.3px;line-height:1.5;'}, c.d)
    ));
  });
  root.appendChild(grid);
  if(window.matchMedia && window.matchMedia('(max-width:900px)').matches){ grid.style.gridTemplateColumns='1fr 1fr'; }
  if(window.matchMedia && window.matchMedia('(max-width:560px)').matches){ grid.style.gridTemplateColumns='1fr'; }

  /* --- single dose panel --- */
  root.appendChild(el('div',{class:'eyebrow',style:'margin:8px 0 12px;'},'Single dose — absorption vs. elimination'));
  const panel1 = el('div',{class:'card'});
  const controls1 = el('div',{style:'display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px;'});
  function sliderRow(label, min, max, step, val, fmt){
    const wrap = el('div',{style:'min-width:200px;flex:1;'});
    const lbl = el('div',{style:'display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:6px;'},
      el('span',{},label), el('span',{class:'mono','data-out':true}, fmt(val)));
    const input = el('input',{type:'range',min,max,step,value:val,style:'width:100%;accent-color:var(--sys-signal);'});
    input.addEventListener('input', ()=>{ lbl.querySelector('[data-out]').textContent = fmt(+input.value); redraw1(); });
    wrap.appendChild(lbl); wrap.appendChild(input);
    wrap.getVal = ()=>+input.value;
    return wrap;
  }
  const kaCtl = sliderRow('Absorption rate (Ka)', 0.2, 3, 0.05, 1.0, v=>v.toFixed(2)+'/h');
  const halfLifeCtl = sliderRow('Half-life', 1, 24, 0.5, 4, v=>v.toFixed(1)+'h');
  controls1.appendChild(kaCtl); controls1.appendChild(halfLifeCtl);
  panel1.appendChild(controls1);
  const canvas1 = el('canvas',{style:'width:100%;display:block;'});
  panel1.appendChild(canvas1);
  const readout1 = el('div',{class:'pill-list',style:'margin-top:12px;'});
  panel1.appendChild(readout1);
  root.appendChild(panel1);

  function redraw1(){
    const ka = kaCtl.getVal(), hl = halfLifeCtl.getVal(), ke = Math.log(2)/hl;
    const tMax = Math.min(48, hl*8);
    const pts = pkSeries(ka, ke, 100, 1, 1, 0, tMax, tMax/200);
    const tmax = Math.log(ka/ke)/(ka-ke);
    const cmax = pkConc(tmax, ka, ke, 100, 1, 1, 0);
    drawPKChart(canvas1, [{points:pts, color:getComputedStyle(document.documentElement).getPropertyValue('--sys-signal').trim(), fill:true}],
      {annotations:[{t:tmax, c:cmax, label:`Tmax ${tmax.toFixed(1)}h`}]});
    readout1.innerHTML='';
    readout1.appendChild(el('span',{class:'pill'}, `Tmax ≈ ${tmax.toFixed(1)}h`));
    readout1.appendChild(el('span',{class:'pill'}, `Cmax ≈ ${cmax.toFixed(0)} (relative units)`));
    readout1.appendChild(el('span',{class:'pill'}, `Half-life = ${hl.toFixed(1)}h`));
  }
  setTimeout(redraw1, 30);

  /* --- steady state panel --- */
  root.appendChild(el('div',{class:'eyebrow',style:'margin:26px 0 12px;'},'Repeated dosing — reaching steady state'));
  const panel2 = el('div',{class:'card'});
  panel2.appendChild(el('p',{class:'text-muted',style:'font-size:12.8px;margin-bottom:12px;'}, 'Same drug as above, dosed every 24h. Notice steady state arrives at roughly the same point (~4–5 half-lives) regardless of the dose amount — only the half-life changes the timeline.'));
  const canvas2 = el('canvas',{style:'width:100%;display:block;'});
  panel2.appendChild(canvas2);
  root.appendChild(panel2);
  function redraw2(){
    const ka = kaCtl.getVal(), hl = halfLifeCtl.getVal(), ke = Math.log(2)/hl;
    const numDoses = 8, interval=24;
    const tMax = numDoses*interval;
    const pts = pkMultiDose(ka, ke, 100, 1, 1, interval, numDoses, tMax, tMax/300);
    drawPKChart(canvas2, [{points:pts, color:getComputedStyle(document.documentElement).getPropertyValue('--sys-gi').trim(), fill:true}],
      {height:220});
  }
  setTimeout(redraw2, 30);

  /* --- delivery comparison panel --- */
  root.appendChild(el('div',{class:'eyebrow',style:'margin:26px 0 12px;'},'Delivery technology — release profile comparison'));
  const panel3 = el('div',{class:'card'});
  panel3.appendChild(el('p',{class:'text-muted',style:'font-size:12.8px;margin-bottom:12px;'}, 'Three release strategies for the same drug class: an immediate-release profile, a delayed-release (enteric-coated) profile with an absorption lag, and a dual delayed-release profile — the dexlansoprazole approach — that layers a second pulse on top of the first.'));
  const canvas3 = el('canvas',{style:'width:100%;display:block;'});
  panel3.appendChild(canvas3);
  const legend3 = el('div',{class:'pill-list',style:'margin-top:10px;'});
  root.appendChild(panel3);
  function redraw3(){
    const ka=1.1, ke=Math.log(2)/2.5;
    const tMax=16, step=tMax/240;
    const ir = pkSeries(ka, ke, 100, 1, 1, 0, tMax, step);
    const dr = pkSeries(ka, ke, 100, 1, 1, 1.5, tMax, step);
    const dual = [];
    for(let t=0;t<=tMax;t+=step){
      dual.push({t, c: pkConc(t,ka,ke,60,1,1,1) + pkConc(t,ka,ke,55,1,1,5.5)});
    }
    const cs = getComputedStyle(document.documentElement);
    drawPKChart(canvas3, [
      {points:ir, color:cs.getPropertyValue('--text-faint').trim()},
      {points:dr, color:cs.getPropertyValue('--sys-gi').trim()},
      {points:dual, color:cs.getPropertyValue('--sys-derm').trim()}
    ], {height:230});
    legend3.innerHTML='';
    [['Immediate-release','--text-faint'],['Delayed-release (lag)','--sys-gi'],['Dual delayed-release','--sys-derm']].forEach(([lab,varName])=>{
      legend3.appendChild(el('span',{class:'pill',style:`border-color:${cs.getPropertyValue(varName).trim()}66;`}, lab));
    });
  }
  panel3.appendChild(legend3);
  setTimeout(redraw3, 30);
};

DATA.mechanisms = [
  {
    id:'ppi-mechanism', name:'Proton pump inhibition', sys:'gi',
    fields:[
      ['Target','The H⁺/K⁺-ATPase (proton pump) on the luminal membrane of gastric parietal cells.'],
      ['Downstream effect','Irreversible blockade of the final common step of acid secretion — acid production stops regardless of what stimulated the pump (histamine, gastrin, or acetylcholine).'],
      ['Clinical implications','Because inhibition is irreversible, effect duration tracks pump turnover (~24–48h to regenerate meaningful capacity), not plasma half-life — this is why once-daily dosing works despite a short half-life. Activation requires the pump to be actively secreting acid, hence the meal-timing rule.'],
      ['Key examples','Omeprazole, esomeprazole, pantoprazole, rabeprazole, lansoprazole, dexlansoprazole.'],
      ['Why it matters','Blocking the shared final pathway is more complete than blocking any single upstream receptor — the reason PPIs outperform H2 blockers on acid suppression.'],
      ['Comparison with alternatives','H2 receptor antagonists block only the histamine-driven input, leaving gastrin/acetylcholine-driven secretion untouched. PCABs (below) hit the identical target reversibly, without needing acid-catalyzed activation.']
    ]
  },
  {
    id:'pcab-mechanism', name:'Potassium-competitive acid blockade', sys:'gi',
    fields:[
      ['Target','The same H⁺/K⁺-ATPase as PPIs, but at the potassium-binding site rather than the covalent cysteine site PPIs use.'],
      ['Downstream effect','Reversible, competitive inhibition — the pump is blocked without needing chemical activation by stomach acid first.'],
      ['Clinical implications','Faster onset (no multi-dose ramp-up), no dependence on meal timing for activation, and more complete/consistent suppression, including overnight.'],
      ['Key examples','Vonoprazan and related PCABs.'],
      ['Why it matters','Removes the single biggest practical limitation of PPIs — the requirement for an acidic, meal-stimulated environment to switch on.'],
      ['Comparison with alternatives','Faster and more genotype-independent than PPIs; still the same final target, so downstream physiology like rebound acid hypersecretion on withdrawal is relevant to both classes.']
    ]
  },
  {
    id:'cox-mechanism', name:'COX inhibition', sys:'gi',
    fields:[
      ['Target','Cyclooxygenase enzymes — COX-1 (mostly constitutive) and COX-2 (mostly inducible) — which convert arachidonic acid into prostaglandins and thromboxane.'],
      ['Downstream effect','Reduced prostaglandin synthesis lowers inflammation, pain signaling, and fever — but also reduces gastroprotective/renal-protective prostaglandins (COX-1) and vascular prostacyclin (COX-2).'],
      ['Clinical implications','The same enzyme family explains the therapeutic effect and essentially all major NSAID toxicities at once — GI, renal, and cardiovascular risk are different faces of one mechanism, not separate side effects.'],
      ['Key examples','Ibuprofen, naproxen, diclofenac (nonselective); celecoxib, etoricoxib (COX-2 selective); aspirin (irreversible, uniquely antiplatelet).'],
      ['Why it matters','A textbook case of one molecular target explaining an entire risk-benefit profile — see NSAID Evolution for how 40 years of drug design tried to split the "good" and "bad" effects of this one enzyme family.'],
      ['Comparison with alternatives','Acetaminophen achieves analgesia/antipyresis through a still-debated, mostly central mechanism without meaningful peripheral COX-1/2 inhibition — explaining its GI safety and lack of real anti-inflammatory effect.']
    ]
  },
  {
    id:'cellwall-mechanism', name:'Cell wall synthesis inhibition', sys:'anti',
    fields:[
      ['Target','Penicillin-binding proteins (PBPs) — enzymes that cross-link peptidoglycan strands in the bacterial cell wall.'],
      ['Downstream effect','Without cross-linking, the wall can\u2019t withstand osmotic pressure and the bacterium lyses — bactericidal, and selective for bacteria since human cells have no cell wall.'],
      ['Clinical implications','Time-dependent killing — efficacy tracks how long drug levels stay above the minimum inhibitory concentration, not how high the peak is — which drives beta-lactam dosing frequency.'],
      ['Key examples','Penicillins, cephalosporins.'],
      ['Why it matters','One of the cleanest examples of selective toxicity in pharmacology: the target simply doesn\u2019t exist in human cells.'],
      ['Comparison with alternatives','Vancomycin (not covered elsewhere on this site) blocks an earlier step in the same broad pathway — useful against organisms resistant to PBP-targeting beta-lactams.']
    ]
  },
  {
    id:'ribosome30s-mechanism', name:'Protein synthesis inhibition — 30S subunit', sys:'anti',
    fields:[
      ['Target','The bacterial 30S ribosomal subunit.'],
      ['Downstream effect','Tetracyclines block aminoacyl-tRNA binding (bacteriostatic); aminoglycosides cause misreading of the genetic code during translation (bactericidal) — same subunit, different binding site, different outcome.'],
      ['Clinical implications','Aminoglycoside uptake requires active oxidative bacterial metabolism, which is exactly why the class has zero activity against anaerobes — a direct mechanistic consequence, not a spectrum coincidence.'],
      ['Key examples','Doxycycline, minocycline (tetracyclines); gentamicin, amikacin (aminoglycosides).'],
      ['Why it matters','Shows that sharing a ribosomal subunit doesn\u2019t mean sharing a mechanism or outcome — binding site and downstream consequence matter as much as target identity.'],
      ['Comparison with alternatives','The 50S-targeting drugs below hit a different ribosomal component entirely, which is why tetracyclines and macrolides don\u2019t share cross-resistance despite both inhibiting protein synthesis.']
    ]
  },
  {
    id:'ribosome50s-mechanism', name:'Protein synthesis inhibition — 50S subunit', sys:'anti',
    fields:[
      ['Target','The bacterial 50S ribosomal subunit.'],
      ['Downstream effect','Macrolides block translocation during elongation; clindamycin binds an overlapping site with a similar effect — both mostly bacteriostatic.'],
      ['Clinical implications','Because macrolides and clindamycin share an overlapping binding site, ribosomal methylation resistance (the MLSb phenotype) confers cross-resistance across both — the basis for the clinical D-test before relying on clindamycin against certain staph isolates.'],
      ['Key examples','Azithromycin, clarithromycin, erythromycin (macrolides); clindamycin (lincosamide).'],
      ['Why it matters','Explains both the shared toxin-suppression utility of this group (less protein synthesis means less bacterial exotoxin production, relevant in severe strep/staph disease) and the shared resistance liability.'],
      ['Comparison with alternatives','Contrast with the 30S-targeting drugs above — different subunit, no cross-resistance, entirely different spectrum logic.']
    ]
  },
  {
    id:'folate-mechanism', name:'Folate synthesis inhibition', sys:'anti',
    fields:[
      ['Target','Two sequential bacterial folate-synthesis enzymes — dihydropteroate synthase (blocked by sulfamethoxazole) and dihydrofolate reductase (blocked by trimethoprim).'],
      ['Downstream effect','Blocking two steps in the same pathway is synergistic — bacteria can\u2019t easily route around a sequential double block the way they might a single-step inhibition.'],
      ['Clinical implications','Human cells obtain folate from the diet rather than synthesizing it — which is why this pathway is selectively bacterial, and why methotrexate (which blocks the analogous mammalian enzyme) is such a dangerous combination with trimethoprim.'],
      ['Key examples','Trimethoprim-sulfamethoxazole.'],
      ['Why it matters','A clean example of deliberate sequential blockade as a pharmacological strategy, distinct from simply combining two unrelated mechanisms.'],
      ['Comparison with alternatives','Most other classes here hit a single, non-sequential target — this combination\u2019s synergy is a designed feature, not a coincidence of co-administration.']
    ]
  },
  {
    id:'dnareplication-mechanism', name:'DNA replication inhibition', sys:'anti',
    fields:[
      ['Target','Bacterial DNA gyrase and topoisomerase IV — enzymes that manage DNA supercoiling during replication.'],
      ['Downstream effect','Blocking these enzymes prevents DNA unwinding/religation, causing strand breaks and cell death — bactericidal, concentration-dependent.'],
      ['Clinical implications','Structural distinctness from human topoisomerases makes the class selectively bactericidal, though its broader connective-tissue adverse effects (tendon, CNS, vascular) remain an area of ongoing research rather than a fully settled mechanism.'],
      ['Key examples','Ciprofloxacin, levofloxacin, moxifloxacin.'],
      ['Why it matters','Illustrates concentration-dependent killing — higher peak-to-MIC ratios predict efficacy, a genuinely different dosing philosophy than the time-dependent logic of beta-lactams.'],
      ['Comparison with alternatives','Directly contrasts with beta-lactams\u2019 time-dependent killing — two different bactericidal strategies requiring different dosing logic to optimize.']
    ]
  },
  {
    id:'keratinization-mechanism', name:'Keratinization normalization', sys:'derm',
    fields:[
      ['Target','Retinoic acid receptors (RARs) in keratinocytes.'],
      ['Downstream effect','Normalizes the rate and pattern of keratinocyte shedding within the follicle, preventing the abnormal cohesion that forms a microcomedone — the first step of acne pathogenesis.'],
      ['Clinical implications','Because this addresses the earliest step in the pathogenic cascade, retinoids are foundational/first-line for comedonal acne — but the same turnover-acceleration is also what causes the initial "purge" and irritation.'],
      ['Key examples','Tretinoin, adapalene, tazarotene (topical); isotretinoin (oral, systemic).'],
      ['Why it matters','A rare case where one receptor-mediated effect explains both a drug\u2019s primary benefit and its main tolerability challenge.'],
      ['Comparison with alternatives','Salicylic acid achieves a related but distinct outcome — direct chemical exfoliation of the follicular lining, without receptor signaling — part of why it\u2019s gentler but generally less powerful.']
    ]
  },
  {
    id:'dual-mechanism', name:'Antimicrobial + anti-inflammatory dual mechanisms', sys:'derm',
    fields:[
      ['Target','Varies by drug — tetracyclines act on the C. acnes 30S ribosome and, separately, inhibit matrix metalloproteinases and neutrophil chemotaxis; benzoyl peroxide combines non-specific oxidative bacterial killing with mild direct comedolytic activity.'],
      ['Downstream effect','Two mechanistically independent effects from one molecule — antibacterial and anti-inflammatory action don\u2019t have to travel together, but in these specific agents, they do.'],
      ['Clinical implications','Explains why sub-antimicrobial-dose doxycycline is sometimes used purely for its anti-inflammatory effect, independent of any antibacterial goal, and why benzoyl peroxide stays useful even with sparse bacterial involvement.'],
      ['Key examples','Doxycycline/minocycline (dual mechanism in acne), benzoyl peroxide (oxidative kill + mild comedolytic).'],
      ['Why it matters','A reminder that a drug\u2019s effect in a specific indication isn\u2019t always fully explained by its textbook primary mechanism.'],
      ['Comparison with alternatives','Contrast with topical clindamycin, which is essentially single-mechanism (antibacterial only) here — part of why it\u2019s paired with benzoyl peroxide for a complementary, not redundant, effect.']
    ]
  }
];

    A_moderate_pigmentation:{leaf:true, title:'Active acne with concurrent pigmentation', rec:'Azelaic acid or a retinoid alongside standard inflammatory acne therapy — both offer a genuine PIH benefit — rather than treating pigmentation only after acne clears.', why:'Turnover-based and tyrosinase-based pigment mechanisms can run in parallel with standard inflammatory treatment rather than waiting for it to finish.', links:[['derm','pih','See the PIH handbook entry']]},
    A_severe:{leaf:true, tone:'caution', title:'Severe / scarring-risk acne', rec:'Refer for consideration of isotretinoin — the only option here aiming for durable remission rather than ongoing management — particularly given scarring risk. Topical and oral bridge therapy are reasonable while awaiting evaluation, not substitutes for it.', why:'Scarring risk changes the urgency calculus: delay itself carries a cost that milder acne doesn\u2019t.', links:[['acne','isotretinoin','See isotretinoin']]},
    A_marks:{leaf:true, title:'Mostly post-inflammatory marks', rec:'Redirect toward pigment-modulating agents (azelaic acid, niacinamide, or hydroquinone for stubborn marks) and daily sunscreen, rather than escalating antibacterial or anti-inflammatory therapy the current picture doesn\u2019t need.', why:'Marks and active lesions need different tools — treating a resolved mark like active acne wastes the antimicrobial/anti-inflammatory strategy on a problem it can\u2019t solve.', links:[['acne','hydroquinone','See hydroquinone']]}
  }
};

function renderAlgorithm(container, tree){
  let path = [tree.start];
  const body = el('div',{});
  container.appendChild(body);
  function draw(){
    body.innerHTML='';
    const nodeId = path[path.length-1];
    const node = tree.nodes[nodeId];
    if(path.length>1){
      const back = el('button',{class:'btn btn-ghost btn-sm',style:'margin-bottom:14px;'},'← Back');
      back.addEventListener('click', ()=>{ path.pop(); draw(); });
      body.appendChild(back);
    }
    if(!node.leaf){
      body.appendChild(el('div',{class:'h3',style:'margin-bottom:14px;'}, node.q));
      const opts = el('div',{style:'display:flex;flex-direction:column;gap:8px;'});
      node.options.forEach(o=>{
        const b = el('button',{class:'card card-interactive',style:'text-align:left;width:100%;font-size:13.5px;padding:14px 16px;'}, o.label);
        b.addEventListener('click', ()=>{ path.push(o.next); draw(); });
        opts.appendChild(b);
      });
      body.appendChild(opts);
    } else {
      const toneColor = node.tone==='caution' ? 'var(--sys-derm)' : 'var(--good)';
      const card = el('div',{class:'card',style:`border-color:${toneColor}55;`},
        el('span',{class:'badge',style:`background:${toneColor}1f;color:${toneColor};`}, node.tone==='caution'?'Needs care':'Suggested approach'),
        el('div',{class:'h3',style:'margin-top:10px;margin-bottom:10px;'}, node.title),
        el('div',{style:'margin-bottom:10px;'}, el('span',{class:'field-label'},'Approach'), el('div',{class:'field-value'}, node.rec)),
        el('div',{}, el('span',{class:'field-label'},'Why'), el('div',{class:'field-value'}, node.why))
      );
      if(node.caution) card.appendChild(el('div',{class:'text-faint',style:'font-size:12px;margin-top:10px;'}, '⚠ '+node.caution));
      if(node.links){
        const linkRow = el('div',{class:'pill-list',style:'margin-top:14px;'});
        node.links.forEach(([view,id,label])=>{
          const p = el('span',{class:'pill',style:'cursor:pointer;'}, label);
          p.addEventListener('click', ()=>navigate(view,id));
          linkRow.appendChild(p);
        });
        card.appendChild(linkRow);
      }
      body.appendChild(card);
      const restart = el('button',{class:'btn btn-ghost btn-sm',style:'margin-top:14px;'},'Start over');
      restart.addEventListener('click', ()=>{ path=[tree.start]; draw(); });
      body.appendChild(restart);
    }
  }
  draw();
}

function buildDirectory(){
  const items = [];
  (DATA.ppi||[]).forEach(d=>items.push({id:d.id,name:d.name,meta:d.cls,sys:'gi',view:'ppi'}));
  (DATA.nsaid||[]).forEach(d=>items.push({id:d.id,name:d.name,meta:d.cls,sys:'gi',view:'nsaid'}));
  (DATA.antibiotics||[]).forEach(c=>items.push({id:c.id,name:c.name,meta:c.sub,sys:'anti',view:'antibiotics'}));
  (DATA.acne||[]).forEach(d=>items.push({id:d.id,name:d.name,meta:d.cls,sys:'derm',view:'acne'}));
  (DATA.wiki||[]).forEach(d=>items.push({id:d.id,name:d.name,meta:d.cls||'Drug atlas',sys:'signal',view:'wiki'}));
  return items;
}

function findEntity(id){
  let hit = (DATA.ppi||[]).find(d=>d.id===id); if(hit) return Object.assign({},hit,{sys:'gi',view:'ppi'});
  hit = (DATA.nsaid||[]).find(d=>d.id===id); if(hit) return Object.assign({},hit,{sys:'gi',view:'nsaid'});
  hit = (DATA.antibiotics||[]).find(d=>d.id===id); if(hit) return Object.assign({},hit,{sys:'anti',view:'antibiotics'});
  hit = (DATA.acne||[]).find(d=>d.id===id); if(hit) return Object.assign({},hit,{sys:'derm',view:'acne'});
  hit = (DATA.mechanisms||[]).find(d=>d.id===id); if(hit) return Object.assign({},hit,{view:'mechanisms'});
  hit = (DATA.derm||[]).find(d=>d.id===id); if(hit) return {id:hit.id, name:hit.name, sys:'derm', view:'derm', fields:null};
  hit = (DATA.wiki||[]).find(d=>d.id===id); if(hit) return Object.assign({},hit,{sys:'signal',view:'wiki'});
  return null;
}
